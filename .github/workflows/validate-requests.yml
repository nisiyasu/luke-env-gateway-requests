name: Validate LUKE QUEST Gateway Requests

on:
  push:
    paths:
      - "requests/**/*.json"
      - "validate_requests.py"
  pull_request:
    paths:
      - "requests/**/*.json"
      - "validate_requests.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python validate_requests.py

name: Finalize LUKE QUEST Gateway Drafts

on:
  push:
    paths:
      - "inbox/**/*.json"
      - "finalize_inbox.py"
      - "validate_requests.py"
      - ".github/workflows/finalize-inbox.yml"
  workflow_dispatch:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"

permissions:
  contents: write

concurrency:
  group: lq-env-request-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Finalize immutable requests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python finalize_inbox.py
      - name: Commit finalized requests
        run: |
          git config user.name "lq-env-request-finalizer"
          git config user.email "lq-env-request-finalizer@users.noreply.github.com"
          git add -A requests
          if [ -d evidence-requests ]; then
            git add -A evidence-requests
          fi
          if [ -d superseded ]; then
            git add -A superseded
          fi
          if [ -d rejected ]; then
            git add rejected
          fi
          if git diff --cached --quiet; then
            echo "No finalized request changes."
            exit 0
          fi
          git commit -m "gateway: finalize request drafts"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push race detected; rebasing attempt=$attempt"
            git pull --rebase origin main
          done
          echo "finalizer push retries exhausted"
          exit 1

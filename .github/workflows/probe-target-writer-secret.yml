name: Probe Target Writer Secret

on:
  push:
    paths:
      - ".github/workflows/probe-target-writer-secret.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check secret availability
        env:
          TARGET_TOKEN: ${{ secrets.LQ_ENV_GATEWAY_WRITER_TOKEN }}
        run: |
          if [ -z "$TARGET_TOKEN" ]; then
            echo "TARGET_WRITER_SECRET_AVAILABLE=false"
            exit 78
          fi
          echo "TARGET_WRITER_SECRET_AVAILABLE=true"
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $TARGET_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nisiyasu/-luke-quest/actions/workflows/env-visual-gateway-request-poller.yml/dispatches \
            -d '{"ref":"main"}')
          echo "HTTP_STATUS=$code"
          cat response.json || true
          test "$code" = "204"

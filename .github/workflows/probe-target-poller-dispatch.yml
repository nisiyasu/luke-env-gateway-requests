name: Probe Target Poller Dispatch

on:
  push:
    paths:
      - ".github/workflows/probe-target-poller-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch target environment poller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nisiyasu/-luke-quest/actions/workflows/env-visual-gateway-request-poller.yml/dispatches \
            -d '{"ref":"main"}')
          echo "HTTP_STATUS=$code"
          cat response.json || true
          if [ "$code" = "204" ]; then
            echo "CROSS_REPO_DISPATCH_SUPPORTED=true"
            exit 0
          fi
          echo "CROSS_REPO_DISPATCH_SUPPORTED=false"
          exit 78
